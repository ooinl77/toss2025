<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>계산기 프로그램</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4" style="width: 300px;">
    <h4 class="text-center mb-4">계산기 프로그램</h4>
    
    <label for="num1">숫자 1</label>
    <input id="num1" class="form-control mb-2" type="number" />

    <label for="num2">숫자 2</label>
    <input id="num2" class="form-control mb-2" type="number" />

    <label>연산 결과</label>
    <input id="result" class="form-control mb-3 bg-secondary text-white" readonly />

    <div class="d-grid gap-2">
      <button onclick="calculate('add')" class="btn btn-primary">덧셈</button>
      <button onclick="calculate('sub')" class="btn btn-primary">뺄셈</button>
      <button onclick="calculate('mul')" class="btn btn-primary">곱셈</button>
      <button onclick="calculate('div')" class="btn btn-primary">나눗셈</button>
      <button onclick="clearFields()" class="btn btn-danger">지우기</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
